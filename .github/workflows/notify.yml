name: DEU Notice Bot

on:
  schedule:
    # 평일 오전 8시 ~ 오후 6시, 30분마다 실행 (KST = UTC+9)
    - cron: "0,30 23 * * 0-4"   # 월~금 오전 8:00, 8:30 KST
    - cron: "0,30 0-8 * * 1-5"  # 월~금 오전 9:00 ~ 오후 5:30 KST
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  check-notice:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # seen.json 커밋을 위해 필요

    # 작업 수준에서 Node.js 24 사용 강제 설정
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          # 카테고리별 채널 웹후크. 등록하지 않은 카테고리는 건너뜁니다.
          WEBHOOK_GENERAL: ${{ secrets.WEBHOOK_GENERAL }}
          WEBHOOK_SCHOLARSHIP: ${{ secrets.WEBHOOK_SCHOLARSHIP }}
          WEBHOOK_EDUCATION: ${{ secrets.WEBHOOK_EDUCATION }}
          WEBHOOK_DORMITORY: ${{ secrets.WEBHOOK_DORMITORY }}
          WEBHOOK_JOB: ${{ secrets.WEBHOOK_JOB }}
          WEBHOOK_BIDS: ${{ secrets.WEBHOOK_BIDS }}
          WEBHOOK_EXTERNAL: ${{ secrets.WEBHOOK_EXTERNAL }}
          # 위 값이 없는 카테고리는 이 공용 웹후크로 전송됩니다.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 선택: 제목에 이 키워드가 들어간 공지만 전송 (쉼표 구분, 비우면 전체)
          NOTICE_KEYWORDS: ${{ vars.NOTICE_KEYWORDS }}
        run: python main.py

      - name: Commit and Push seen.json
        if: always()           # 전송이 일부 실패해도 전송 기록은 남깁니다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          # 변경사항이 있을 때만 커밋 (에러 방지)
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen.json [skip ci]"
            git push
          fi
