name: DEU Notice Bot

on:
  schedule:
    # 평일 오전 8시 ~ 오후 6시, 30분마다 실행 (KST = UTC+9)
    - cron: "0,30 23 * * 0-4"   # 월~금 오전 8:00, 8:30 KST
    - cron: "0,30 0-8 * * 1-5"  # 월~금 오전 9:00 ~ 오후 5:30 KST
  workflow_dispatch:           # 수동 실행 버튼

jobs:
  check-notice:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # seen.json 커밋을 위해 필요

    # 작업 수준에서 Node.js 24 사용 강제 설정
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit and Push seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          # 변경사항이 있을 때만 커밋 (에러 방지)
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen.json [skip ci]"
            git push
          fi
