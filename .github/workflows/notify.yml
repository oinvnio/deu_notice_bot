name: DEU Notice Bot

on:
  schedule:
    # 평일 오전 8시 ~ 오후 6시, 30분마다 실행 (KST = UTC+9)
    # UTC 기준: 23:00 ~ 09:00
    - cron: "0,30 23 * * 0-4"   # 일~목 23:00, 23:30 UTC (월~금 08:00, 08:30 KST)
    - cron: "0,30 0-8 * * 1-5"  # 월~금 00:00~08:30 UTC (월~금 09:00~17:30 KST)
  workflow_dispatch:             # 수동 실행 버튼

jobs:
  check-notice:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # seen.json 커밋을 위해 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Commit seen.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "chore: update seen.json [skip ci]"
          git push
